spring:
  application:
    name: chamados

  datasource:
    url: "jdbc:h2:mem:chamadosdb"
    driver-class-name: "org.h2.Driver"
    username: "sa"
    password: ""

  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true

  h2:
    console:
      enabled: true
      path: "/h2-console"

springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    operations-sorter: "method"
    tags-sorter: "alpha"
    try-it-out-enabled: true
    display-request-duration: true
    filter: true
    doc-expansion: "none"
